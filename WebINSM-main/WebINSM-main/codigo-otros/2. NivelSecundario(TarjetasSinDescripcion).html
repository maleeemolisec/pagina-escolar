<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Insm - Nuestras Especialidades</title>
        <style>
            /* --- Fuentes --- */
            @font-face {
                font-family: 'Heuristica';
                src: url('fonts/Heuristica-Regular.ttf') format('truetype');
                font-weight: normal;
                font-style: normal;
            }
            @font-face {
                font-family: 'ProximaNova';
                src: url('fonts/ProximaNova-Regular.ttf') format('truetype');
                font-weight: normal;
                font-style: normal;
            }

            :root {
                --staff-item-w: 288px;
                --staff-item-h: 486px;
                --staff-active-w: 320px;
                --staff-active-h: 540px;
                --staff-gap: 30px;
            }

            /* --- Estilos Generales y Transiciones --- */
            html, body {
                overflow-x: hidden;
                width: 100%;
                position: relative;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                margin: 0;
                font-family: 'Heuristica', serif;
                color: #333;
                background-color: #f4f6f8;
                animation: fadeInPage 0.5s ease-in-out;
            }
            body.fade-out {
                opacity: 0;
                transition: opacity 0.5s ease-in-out;
            }
            @keyframes fadeInPage {
                from { opacity: 0; }
                to { opacity: 1; }
            }

            /* --- CORRECCIÓN DE SCROLL --- */
            section, .content-block {
                scroll-margin-top: 100px; /* Ajuste para dejar espacio arriba al navegar */
            }

            /* --- Header --- */
            .header-main {
                background-color: rgba(26, 79, 141, 0.25);
                backdrop-filter: blur(5px);
                -webkit-backdrop-filter: blur(5px);
                color: white;
                padding: 15px 30px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 100;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                transition: all 0.3s ease;
            }
            .header-main .logo a {
                display: flex;
                align-items: center;
                text-decoration: none;
                color: white;
                font-size: 1.5em;
                font-weight: bold;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            }
            .header-main .logo a .mobile-text {
                display: none;
            }
            .header-main .logo img {
                height: 50px;
                margin-right: 10px;
            }
            .header-main nav ul {
                list-style: none;
                margin: 0;
                padding: 0;
                display: flex;
                gap: 25px;
                align-items: center;
            }
            .header-main nav ul li:not(:last-child)::after {
                content: '│';
                color: rgba(130, 163, 189, 0.8);
                margin-left: 25px;
                font-weight: bold;
            }
            .header-main nav ul li a {
                text-decoration: none;
                color: white;
                font-family: 'ProximaNova', sans-serif;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
                transition: color 0.3s ease;
                position: relative;
                padding-bottom: 5px;
            }
            .header-main nav ul li:not(:last-child) a::after {
                content: '';
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 2px;
                background: linear-gradient(90deg, #fff, rgba(255, 255, 255, 0.7));
                transform: scaleX(0);
                transform-origin: left;
                transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }
            .header-main nav ul li:not(:last-child) a:hover::after {
                transform: scaleX(1);
            }
            .header-main nav ul li a:hover {
                color: #f39c12;
            }
            .header-main .menu-icon {
                font-size: 1.3em;
                cursor: pointer;
            }

            /* --- Hero Section --- */
            .hero-section {
                position: relative;
                width: 100%;
                height: 100vh;
                height: 100dvh;
                /* Background movido a ::after para animación */
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding-left: 8%;
                box-sizing: border-box;
                text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
                overflow: hidden; /* Necesario para el zoom del fondo */
            }
            /* Imagen de Fondo con Zoom */
            .hero-section::after {
                content: '';
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                background: url('img/20250806_092322.jpg') no-repeat center center;
                background-size: cover;
                z-index: 0;
                /* Eliminada animación automática, ahora controlada por Scroll/JS */
                transform: scale(var(--hero-scale, 1));
                will-change: transform;
                transition: transform 0.1s linear; /* Suavizado mínimo */
            }
            /* Gradiente Oscuro */
            .hero-section::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(to right, rgba(70, 68, 68, 0.5), rgba(0, 0, 0, 0));
                z-index: 1;
            }
            .hero-content {
                position: relative;
                z-index: 2;
            }
            /* @keyframes heroZoom eliminada */
            @keyframes riseIn {
                0% { transform: translateY(60px); opacity: 0; }
                100% { transform: translateY(0); opacity: 1; }
            }
            .letter { display: inline-block; opacity: 0; white-space: pre; }
            .hero-content h1 {
                font-size: 5.5em;
                margin: 0;
                line-height: 1.1;
                font-weight: normal;
                color: white;
            }
            .hero-content p {
                font-size: 1.05em;
                margin-top: 5px;
                max-width: 500px;
                color: white;
                font-style: italic;
                display: flex;
                flex-direction: column;
                gap: 8px;
                cursor: pointer;
            }
            .hero-arrow {
                width: 145px;
                height: 2px;
                background-color: white;
                position: relative;
                transition: width 0.8s ease;
                align-self: flex-start;
                transform-origin: left;
            }
            .hero-arrow::after {
                content: '';
                position: absolute;
                right: -8px;
                top: -4px;
                width: 0;
                height: 0;
                border-left: 10px solid white;
                border-top: 5px solid transparent;
                border-bottom: 5px solid transparent;
                transition: transform 0.3s ease;
            }
            .hero-content p:hover .hero-arrow { width: 165px; }
            .hero-content p:hover .hero-arrow::after { transform: scale(1.2); }

            /* --- Sección Principal de Contenido (FULL SCREEN) --- */
            .main-content-section {
                padding: 100px 20px; /* Padding reducido laterales */
                background-color: #ffffff;
            }
            .content-container {
                max-width: 1200px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                gap: 100px; /* Separación vertical entre secciones */
            }
            .main-text {
                font-family: 'ProximaNova', sans-serif;
                line-height: 1.8;
                color: #555;
                display: flex;
                flex-direction: column;
                gap: 60px;
                width: 100%;
            }
            .content-block h2 {
                font-family: 'Heuristica', serif;
                font-size: 2.6em;
                color: #cf0621;
                margin: 0 0 20px 0;
                font-weight: normal;
                border-bottom: 2px solid #f39c12;
                padding-bottom: 10px;
                display: inline-block;
            }

            /* --- Estilo: Bienvenida --- */
            .director-section {
                display: flex;
                align-items: center; 
                gap: 40px;
            }
            .director-text { flex: 1; }
            .director-image {
                width: 300px;
                height: 400px;
                object-fit: cover;
                border-radius: 8px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            }
            .director-signature { font-weight: bold; margin-top: 15px; display: block;}

            /* --- NUEVO ESTILO: Especialidades (Tarjetas Dark Style - Minimalista Blanco) --- */

            /* Párrafo introductorio */
            .specialties-intro {
                font-size: 1.1em;
                line-height: 1.8;
                margin-bottom: 40px;
                color: #555;
                text-align: left;
                max-width: 100%;
                margin-left: 0;
                margin-right: 0;
            }

            .specialties-showcase {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 20px;
                justify-content: center;
            }

            @media (max-width: 1024px) {
                .specialties-showcase {
                    grid-template-columns: 1fr;
                }
            }

            /* Tarjeta Base */
            .card-specialty {
                position: relative;
                height: 380px;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: none;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                text-decoration: none;
                color: white;
                /* Animación para cuando aparezca la sombra */
                transition: box-shadow 0.4s ease;
            }

            /* Sombra activada únicamente al hacer hover sobre el BOTÓN */
            .card-specialty:has(.view-more-btn:hover) {
                box-shadow: 0 40px 80px -10px rgba(0, 0, 0, 0.9);
            }

            /* Rutas de imagen locales */
            .card-bg-informatica {
                background: url('img/sala2.jpg') no-repeat center center;
                background-size: cover;
            }

            .card-bg-humanidades {
                background: url('img/HUERTA1.jpg') no-repeat center center;
                background-size: cover
            }

            /* Capa oscura (Overlay) Muy oscura para resaltar el texto */
            .card-specialty::before {
                content: '';
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                z-index: 1;
                background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0.9) 100%);
                opacity: 0.85; /* Mucho más oscuro */
            }

            /* Contenido interno */
            .card-specialty-content {
                position: relative;
                z-index: 2;
                padding: 35px 30px 0 30px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100%;
                width: 100%;
                box-sizing: border-box;
                text-align: center;
            }

            /* Título */
            .card-specialty h3 {
                font-family: 'Heuristica', serif;
                font-size: 2.7em;
                margin: 0 auto 25px auto;
                width: 100%;
                font-weight: normal;
                color: white;
                text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
                line-height: 1.1;
            }

            /* Descripción */
            .card-specialty p {
                font-family: 'ProximaNova', sans-serif;
                font-size: 1.15em;
                font-weight: normal;
                line-height: 1.4;
                margin: 0 auto 20px auto;
                color: white;
                max-width: 90%;
                width: 100%;
                opacity: 1;
            }

            /* Botón Ver Plan */
            .view-more-btn {
                background-color: #f39c12;
                color: #ffffff;
                border: 2px solid #f39c12;
                padding: 8px 22px;
                font-family: 'ProximaNova', sans-serif;
                font-size: 1.0em;
                font-weight: bold;
                border-radius: 50px;
                cursor: pointer;
                transition: all 0.3s ease;
                text-decoration: none;
                display: inline-block;
                margin: 0 auto;
            }
            .view-more-btn:hover {
                background-color: #cf0621;
                border-color: #cf0621;
                transform: translateY(-3px);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            }

            /* --- Estilo: Requerimientos --- */
            .requirements-list {
                list-style: none;
                padding: 0;
            }
            .requirements-list li {
                margin-bottom: 15px;
                padding-left: 30px;
                position: relative;
                font-size: 1.1em;
            }
            .requirements-list li::before {
                content: '\f00c';
                font-family: 'Font Awesome 5 Free';
                font-weight: 900;
                color: #cf0621;
                position: absolute;
                left: 0;
                top: 0;
            }

            /* --- Estilo: AEC --- */
            .aec-container {
                text-align: center;
                background-color: #f4f4f4;
                padding: 60px 40px;
                border-radius: 8px;
            }
            .aec-btn {
                display: inline-flex;
                align-items: center;
                padding: 15px 30px;
                margin-top: 20px;
                background-color: #f4f6f8;
                border: 1px solid #e0e0e0;
                border-radius: 8px;
                text-decoration: none;
                color: #333;
                font-family: 'ProximaNova', sans-serif;
                font-weight: bold;
                transition: all 0.3s ease;
            }
            .aec-btn i {
                font-size: 1.5em;
                margin-right: 15px;
                color: #cf0621;
            }
            .aec-btn span {
                text-align: left;
                display: flex;
                flex-direction: column;
                line-height: 1.2;
            }
            .aec-btn small {
                display: block;
                font-weight: normal;
                color: #666;
                font-size: 0.8em;
            }
            .aec-btn:hover {
                background-color: #ffffff;
                border-color: #cf0621;
                transform: translateY(-3px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.05);
                color: #333;
            }

            /* --- Menú desplegable --- */
            .dropdown-menu {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                background-color: rgba(26, 79, 141, 0.25);
                backdrop-filter: blur(5px);
                z-index: 1000;
                display: none;
                opacity: 0;
                transform: translateY(-100%);
                transition: all 0.3s ease-in-out;
            }
            .dropdown-menu.show {
                display: block;
                opacity: 1;
                transform: translateY(0);
            }
            .dropdown-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 15px 20px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
            .dropdown-header .logo {
                display: flex;
                align-items: center;
                font-size: 1.5em;
                font-weight: bold;
                color: white;
            }
            .dropdown-header .logo img {
                height: 50px;
                margin-right: 10px;
            }
            .close-menu {
                color: white;
                font-size: 1.5em;
                cursor: pointer;
                background: none;
                border: none;
            }
            .menu-content {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 1px;
                height: calc(100vh - 80px);
                background-color: rgba(150, 150, 150, 0.25);
                backdrop-filter: blur(5px);
            }
            .menu-section {
                background-color: rgba(150, 150, 150, 0.25);
                backdrop-filter: blur(5px);
                padding: 30px 20px;
                display: flex;
                flex-direction: column;
            }
            .menu-section h3 {
                color: #cf0621;
                font-family: 'ProximaNova', sans-serif;
                font-size: 1.4em;
                margin: 0 0 20px 0;
                font-weight: bold;
                padding-bottom: 10px;
                position: relative;
                display: inline-block;
                cursor: pointer;
            }
            .menu-section h3::after {
                content: '';
                position: absolute;
                left: 0;
                bottom: 0;
                width: 0;
                height: 2px;
                background-color: #f39c12;
                transition: width 0.3s cubic-bezier(0.075, 0.82, 0.165, 1);
            }
            .menu-section h3:hover::after {
                width: 100%;
            }
            .menu-section ul {
                list-style: none;
                padding: 0;
                margin: 0;
                flex-grow: 1;
            }
            .menu-section ul li {
                margin-bottom: 12px;
            }
            .menu-section ul li a {
                color: rgb(255, 255, 255);
                text-decoration: none;
                font-family: 'ProximaNova', sans-serif;
                font-size: 1em;
                transition: color 0.2s ease;
                background: none;
                padding: 0;
            }
            .menu-section ul li a:hover {
                color: #f39c12;
                text-decoration: underline;
            }

            /* --- Footer --- */
            .footer {
                background-color: #cf0621;
                color: #ffffff;
                padding: 80px 40px 20px 40px;
                font-family: 'ProximaNova', sans-serif;
                position: relative;
            }
            .footer-container {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                max-width: 1300px;
                margin: 0 auto;
                gap: 40px;
            }
            .footer-column {
                flex: 1;
            }
            .footer-column:last-child {
                flex: 1.5;
                padding-left: 40px;
            }
            .footer-column h3 {
                color: #f39c12;
                font-size: 1.2em;
                margin-bottom: 25px;
                position: relative;
                font-weight: normal;
                font-family: 'Heuristica', serif;
            }
            .footer-column h3::after {
                content: '';
                display: block;
                width: 50px;
                height: 2px;
                background-color: #f39c12;
                margin-top: 8px;
            }
            .footer-column ul {
                list-style: none;
                padding: 0;
                margin: 0;
            }
            .footer-column ul li {
                margin-bottom: 15px;
            }
            .footer-column ul li a {
                color: #fff;
                text-decoration: none;
                transition: color 0.3s ease;
            }
            .footer-column ul li a:hover {
                color: #f39c12;
            }
            .contact-info p {
                margin: 0 0 10px 0;
                line-height: 1.5;
            }
            .social-icons {
                display: flex;
                gap: 15px;
                margin-top: 25px;
            }
            .social-icons a {
                color: #f39c12;
                font-size: 1.5em;
                transition: color 0.3s ease;
            }
            .social-icons a:hover {
                color: #fff;
            }
            .get-directions a {
                display: inline-block;
                padding: 12px 25px;
                border: 1px solid #f39c12;
                color: #fff;
                text-decoration: none;
                border-radius: 5px;
                transition: background-color 0.3s ease, border-color 0.3s ease;
            }
            .get-directions a:hover {
                background-color: #f39c12;
                border-color: #f39c12;
            }
            .footer-bottom {
                border-top: 1px solid rgba(255, 255, 255, 0.2);
                padding-top: 20px;
                margin-top: 50px;
                text-align: center;
                font-size: 0.9em;
            }

            /* --- Estilo: Uniforme (Inspirado en Áreas Curriculares) --- */
            .uniform-grid {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
                margin-top: 30px;
                width: 100%;
            }
            .uniform-card {
                background-color: #fff;
                border: 1px solid #e0e0e0;
                border-radius: 8px;
                padding: 30px;
                text-align: center;
                transition: all 0.3s ease;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 15px;
                box-shadow: none;
                /* Lógica Flex para 3 columnas por defecto */
                flex: 0 0 calc((100% - 40px) / 3);
                box-sizing: border-box;
            }

            /* Responsive para Uniforme */
            @media (max-width: 900px) {
                .uniform-card {
                    flex: 0 0 calc((100% - 20px) / 2);
                }
            }
            @media (max-width: 600px) {
                .uniform-card {
                    flex: 0 0 100%;
                }
            }
            .uniform-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.05);
                border-color: #cf0621;
            }
            .uniform-card i {
                width: 80px;
                height: 80px;
                background-color: #f39c12;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 2.2em;
                color: #fff;
                transition: all 0.3s ease;
                margin-bottom: 5px;
            }
            .uniform-card:hover i {
                background-color: #cf0621;
                transform: scale(1.1);
            }
            
            /* --- Soporte Táctil: Uniforme --- */
            .uniform-card.touch-active {
                transform: translateY(-5px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.05);
                border-color: #cf0621;
            }
            .uniform-card.touch-active i {
                background-color: #cf0621;
                transform: scale(1.1);
            }
            .uniform-card h3 {
                font-family: 'ProximaNova', sans-serif;
                font-weight: bold;
                color: #555;
                font-size: 1.4em;
                margin: 5px 0 10px 0;
            }
            .uniform-card ul {
                list-style: none;
                padding: 0;
                margin: 0 auto;
                text-align: left;
                display: inline-block;
                width: auto;
            }
            .uniform-card ul li {
                margin-bottom: 10px;
                font-family: 'ProximaNova', sans-serif;
                font-size: 1em;
                line-height: 1.5;
                padding-left: 20px;
                position: relative;
                color: #6b6b6b;
            }
            .uniform-card ul li::before {
                content: '•';
                color: #cf0621;
                font-size: 1.2em;
                position: absolute;
                left: 0;
                top: -2px;
            }

            /* --- Estilo: Áreas Curriculares --- */
            .curricular-grid {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
                margin-top: 30px;
                width: 100%;
            }
            .curricular-card {
                background-color: #fff;
                border: 1px solid #e0e0e0;
                border-radius: 8px;
                flex: 0 0 calc((100% - 80px) / 5);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 15px;
                transition: all 0.3s ease;
                box-sizing: border-box;
                cursor: default;
                padding: 20px;
            }
            .curricular-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.05);
                border-color: #cf0621;
            }
            .curricular-card i {
                font-size: 2em;
                color: #f39c12;
                transition: color 0.3s ease;
            }
            .curricular-card:hover i {
                color: #cf0621;
            }
            
            /* --- Soporte Táctil: Áreas Curriculares --- */
            .curricular-card.touch-active {
                transform: translateY(-5px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.05);
                border-color: #cf0621;
            }
            .curricular-card.touch-active i {
                color: #cf0621;
            }
            .curricular-card h3 {
                font-family: 'ProximaNova', sans-serif;
                font-weight: bold;
                color: #555;
                font-size: 1.1em;
                margin: 0;
                text-align: center;
            }

            /* Responsive: Áreas Curriculares */
            @media (max-width: 1200px) {
                .curricular-card {
                    flex: 0 0 calc((100% - 60px) / 4);
                }
            }
            @media (max-width: 900px) {
                .curricular-card {
                    flex: 0 0 calc((100% - 40px) / 3);
                }
            }

        <script>
            // --- Lógica para la Transición entre Páginas ---
            document.addEventListener('DOMContentLoaded', function () {
                const links = document.querySelectorAll('a');
                links.forEach((link) => {
                    link.addEventListener('click', function (e) {
                        const href = this.getAttribute('href');
                        // Solo aplicar fade-out si no es un ancla interna (#) y NO tiene target="_blank"
                        if (href && !href.startsWith('#') && !link.onclick && !href.includes('mailto:') && !href.includes('tel:') && this.getAttribute('target') !== '_blank') {
                            e.preventDefault();
                            document.body.classList.add('fade-out');
                            setTimeout(() => {
                                window.location.href = href;
                            }, 500);
                        }
                    });
                });
            });
        </script>
